    body {

    /* Thai and Chinese glyphs are taller/denser; give them a little more line height. */
    html[lang="th"] body, html[lang="zh-Hans"] body { line-height: 1.6; }
    html[lang="th"] .truncate { padding-top: 2px; }

    /* Ambient Floating Clouds & Sparkles */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.5)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 18px rgba(244, 114, 182, 0.85)); transform: scale(1.03); }
    }
    @keyframes eggWobbleGentle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-4deg); }
      75% { transform: rotate(4deg); }
    }
    @keyframes eggWobbleIntense {
      0%, 100% { transform: rotate(0deg) scale(1.04); }
      20% { transform: rotate(-10deg) scale(1.06); }
      40% { transform: rotate(10deg) scale(1.06); }
      60% { transform: rotate(-12deg) scale(1.08); }
      80% { transform: rotate(12deg) scale(1.08); }
    }
    @keyframes petBounce {
      0%, 100% { transform: translateY(0) scaleY(1); }
      40% { transform: translateY(-14px) scaleY(1.06); }
      70% { transform: translateY(2px) scaleY(0.95); }
    }
    @keyframes petSleep {
      0%, 100% { transform: scale(1) rotate(-2deg); }
      50% { transform: scale(1.04, 0.96) rotate(2deg); }
    }
    @keyframes sparkleTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(45deg); }
    }
    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(420px) rotate(720deg); opacity: 0; }
    }

    .animate-float-slow { animation: floatSlow 7s ease-in-out infinite; }
    .animate-float-gentle { animation: floatGentle 3.5s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulseGlow 2.4s ease-in-out infinite; }
    .animate-egg-gentle { animation: eggWobbleGentle 1.6s ease-in-out infinite; transform-origin: bottom center; }
    .animate-egg-intense { animation: eggWobbleIntense 0.45s ease-in-out infinite; transform-origin: bottom center; }
    .animate-pet-idle { animation: floatGentle 3s ease-in-out infinite; }
    .animate-pet-happy { animation: petBounce 0.8s ease-in-out infinite; }
    .animate-pet-sleep { animation: petSleep 3.5s ease-in-out infinite; }
    .animate-sparkle { animation: sparkleTwinkle 2.2s ease-in-out infinite; }

    /* Hide scrollbar on horizontally scrolling nav */
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* Respect users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;

    }

    /* Visible keyboard focus */
    button:focus-visible, [role="button"]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {

  <!-- PWA: Service Worker Registration.
       Browsers only allow service workers from a real same-origin script file (not blob: URLs),
       so the worker lives in sw.js next to this page (it only provides offline caching).
       Host index.html, sw.js and the icon PNGs together over HTTPS (or localhost). -->
  <script>
    (function setupPWA() {
      const canUseSW = 'serviceWorker' in navigator &&
        (window.location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(window.location.hostname));
      if (!canUseSW) return;
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('Service worker not registered (is sw.js deployed next to this page?):', err);
        });
      });
    })();
  </script>

    // Auto-award rules, keyed by a badge's `autoRule` field.
    // Supported: 'hatched_N', 'points_N', 'superstar', 'manual' (never auto-awarded).
    function badgeRuleMet(rule, student) {
      if (!rule || rule === 'manual') return false;
      const pts = student.lifetimePoints || 0;
      const hatched = student.hatchedCount || 0;
      if (rule === 'superstar') return pts >= 200 && hatched >= 3;
      let m = /^hatched_(\d+)$/.exec(rule);
      if (m) return hatched >= Number(m[1]);
      m = /^points_(\d+)$/.exec(rule);
      if (m) return pts >= Number(m[1]);
      return false;
    }

    function evaluateAutoBadges(student, badgeList) {
      const current = new Set(student.badges || []);
      (badgeList || []).forEach(b => {
        if (badgeRuleMet(b.autoRule, student)) current.add(b.id);
      });
      return Array.from(current);
    }

    // Fills in missing fields so older saves and hand-edited/partial backups can't crash the app.
    function normalizeWorkspaceState(raw, licenseInfo) {
      const base = createInitialWorkspaceState(licenseInfo);
      const src = raw && typeof raw === 'object' ? raw : {};
      const asArray = (v, fallback) => (Array.isArray(v) ? v : fallback);
      const num = (v, fallback = 0) => (Number.isFinite(Number(v)) ? Number(v) : fallback);

      const settings = { ...base.settings, ...(src.settings || {}) };
      settings.pointsPerHatch = Math.max(10, num(settings.pointsPerHatch, 100));

      const rewards = asArray(src.rewards, base.rewards)
        .filter(r => r && r.id && r.name)
        .map(r => ({ ...r, points: num(r.points, 5), color: r.color || 'bg-pink-100 text-pink-800 border-pink-300' }));

      const badges = asArray(src.badges, base.badges)
        .filter(b => b && b.id && b.name)
        .map(b => ({ description: '', color: '#F472B6', autoRule: 'manual', ...b }));

      const validEgg = (id) => EGG_CATALOG.some(e => e.id === id);
      const validPet = (id) => CREATURE_CATALOG.some(c => c.id === id);

      const students = asArray(src.students, [])
        .filter(s => s && typeof s === 'object')
        .map((s, idx) => {
          const pets = asArray(s.pets, []).filter(validPet);
          return {
            id: s.id || `stu-restored-${idx}-${Math.random().toString(36).slice(2, 6)}`,
            number: num(s.number, idx + 1),
            name: String(s.name || `Student ${idx + 1}`),
            lifetimePoints: Math.max(0, num(s.lifetimePoints)),
            eggProgress: Math.max(0, num(s.eggProgress)),
            currentEggId: validEgg(s.currentEggId) ? s.currentEggId : EGG_CATALOG[idx % EGG_CATALOG.length].id,
            hatchedCount: Math.max(0, num(s.hatchedCount, pets.length)),
            pets,
            activePetId: pets.includes(s.activePetId) ? s.activePetId : (pets[0] || null),
            badges: asArray(s.badges, []),
            history: asArray(s.history, []).filter(tx => tx && tx.id)
          };
        });

      // Older saves stored activity time as a display string ("Just now"); convert to timestamps.
      const activityFeed = asArray(src.activityFeed, [])
        .filter(a => a && (a.text || a.names || a.petId))
        .map(a => ({ ...a, id: a.id || `act-${Math.random().toString(36).slice(2, 8)}`, type: a.type || 'points', at: a.at || null, time: a.at ? undefined : a.time }));

      return {
        ...src,
        meta: { ...base.meta, ...(src.meta || {}), workspaceId: licenseInfo.workspaceId },
        settings,
        students,
        rewards: rewards.length ? rewards : base.rewards,
        badges: badges.length ? badges : base.badges,
        activityFeed
      };
    }

    // New classrooms start empty (no demo students). `setup` comes from the first-run form.
    function createInitialWorkspaceState(licenseInfo, setup = {}) {
      const teacherName = (setup.teacherName || licenseInfo.customerName || '').trim();
      return {
        meta: {
          schemaVersion: 2,
          workspaceId: licenseInfo.workspaceId,
          licenseId: licenseInfo.licenseId,
          customerId: licenseInfo.customerId,
          createdAt: new Date().toISOString(),
          lastBackupAt: null
        },
        settings: {
          classroomName: (setup.classroomName || '').trim() || (teacherName ? t("{name}'s Magical Class", { name: teacherName }) : t('My Magical Class')),
          teacherName,
          language: setup.language || 'en',
          pointsPerHatch: 100,
          showLeaderboard: true,
          soundEnabled: true,
          allowDeductions: true
        },
        students: [],
        rewards: DEFAULT_REWARDS,
        badges: DEFAULT_BADGES,
        activityFeed: []
      };
    }

    // =========================================================================
    // 5. SIGNATURE 10-STAGE ANIMATED EGG-HATCHING MODAL (5–8 Seconds)
    // =========================================================================
    function EggHatchingCeremony({ student, eggId, hatchedPet, onComplete }) {
      // Stages 1 to 10 across ~6.2 seconds
      const [stage, setStage] = useState(1);

      useEffect(() => {
        const timers = [
          setTimeout(() => setStage(2), 600),   // Gentle shake
          setTimeout(() => setStage(3), 1400),  // Intense shake
          setTimeout(() => { setStage(4); SoundFX.playCrack(); }, 2200), // Visible cracks
          setTimeout(() => { setStage(5); SoundFX.playCrack(); }, 3000), // Eggshell splits
          setTimeout(() => setStage(6), 3700),  // Upper shell lifts & falls away
          setTimeout(() => setStage(7), 4300),  // Bright magical burst light
          setTimeout(() => { setStage(8); SoundFX.playHatchFanfare(); }, 4900), // Creature emerges
          setTimeout(() => setStage(9), 5400),  // Creature celebrates
          setTimeout(() => setStage(10), 5900), // Confetti + Collect button
        ];
        return () => timers.forEach(clearTimeout);
      }, []);

      const splitPhase = stage < 5 ? 0 : stage === 5 ? 1 : stage === 6 ? 2 : 3;
      const stageLabels = {
        1: t('Resting in the magical nest...'),
        2: t('Something is stirring inside!'),
        3: t('The egg is shaking with excitement!'),
        4: t('CRACK! Zigzag cracks appear!'),
        5: t('The eggshell is splitting open!'),
        6: t('The upper shell lifts away...'),
        7: t('A brilliant magical light shines!'),
        8: t('A baby {pet} emerges!', { pet: t(hatchedPet.name) }),
        9: t('{pet} blinks and smiles at {name}!', { pet: t(hatchedPet.name), name: student.name }),
        10: t('CONGRATULATIONS! YOU HATCHED A NEW FRIEND!')
      };

      const confettiColors = ['#F472B6', '#38BDF8', '#FBBF24', '#34D399', '#A78BFA', '#FB923C'];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/75 backdrop-blur-md p-4" role="dialog" aria-modal="true" aria-label={`${student.name} egg hatching`}>
          <div className="relative w-full max-w-lg rounded-3xl bg-gradient-to-b from-pastel-cream via-pastel-pink/40 to-pastel-lavender/60 border-4 border-white shadow-2xl p-6 sm:p-8 text-center overflow-hidden">
            {/* Stage 10 Confetti & Magical Particles */}
            {stage >= 8 && (
              <div className="pointer-events-none absolute inset-0 overflow-hidden">
                {Array.from({ length: 28 }).map((_, i) => (
                  <div
                    key={i}
                    className="absolute rounded-sm"
                    style={{
                      left: `${(i * 3.7) % 100}%`,
                      top: '-16px',
                      width: i % 2 === 0 ? '10px' : '7px',
                      height: i % 2 === 0 ? '10px' : '14px',
                      backgroundColor: confettiColors[i % confettiColors.length],
                      animation: `confettiFall ${2.2 + (i % 5) * 0.4}s linear ${(i % 7) * 0.15}s infinite`
                    }}
                  />
                ))}
              </div>
            )}

            {/* Top Student Banner */}
            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/90 text-pink-600 font-bold text-sm shadow-sm mb-3">
              <span>{t("{name}’s Magical Hatchery", { name: student.name })}</span>
              <span className="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-xs">{t("Stage {n}/10", { n: stage })}</span>
            </div>

            {/* Central Stage Visual */}
            <div className="relative h-64 flex items-center justify-center my-2">
              {/* Stage 7 Radial Light Burst */}
              {stage >= 6 && stage <= 9 && (
                <div
                  className="absolute w-56 h-56 rounded-full animate-ping opacity-50"
                  style={{ background: 'radial-gradient(circle, #FEF08A 0%, #F472B6 55%, transparent 75%)' }}
                />
              )}

              {/* Egg Layer (Stages 1–6) */}
              {stage <= 6 && (
                <div className={stage === 2 ? 'animate-egg-gentle' : stage >= 3 ? 'animate-egg-intense' : ''}>
                  <CustomEggSVG
                    eggId={eggId}
                    progress={100}
                    target={100}
                    size={165}
                    isHatching={true}
                    splitPhase={splitPhase}
                  />
                </div>
              )}

              {/* Creature Reveal Layer (Stages 7–10) */}
              {stage >= 7 && (
                <div
                  className="flex flex-col items-center transition-all duration-700"
                  style={{
                    transform: stage === 7 ? 'scale(0.3)' : 'scale(1.15)',
                    opacity: stage === 7 ? 0.3 : 1
                  }}
                >
                  <CustomCreatureSVG creatureId={hatchedPet.id} size={160} mood={stage >= 9 ? 'happy' : 'idle'} />
                </div>
              )}
            </div>

            {/* Dynamic Narrative & Final Celebration */}
            {stage < 10 ? (
              <div className="space-y-3">
                <p className="font-display text-xl sm:text-2xl font-bold text-slate-800 animate-pulse" aria-live="polite">
                  {stageLabels[stage]}
                </p>
                <div className="w-full max-w-xs mx-auto h-2.5 bg-white/80 rounded-full overflow-hidden p-0.5">
                  <div
                    className="h-full rounded-full bg-gradient-to-r from-pink-400 via-amber-400 to-purple-500 transition-all duration-500"
                    style={{ width: `${stage * 10}%` }}
                  />
                </div>
              </div>

        return () => window.removeEventListener('keydown', onKey);

        setBusy(true);
        setError('');

        e.preventDefault();
        if (!teacherName.trim()) {
          setError(t('Please enter your name.'));
          return;

        setError('');
        setBusy(true);
        try {
          await onCreate({ teacherName: teacherName.trim(), classroomName: classroomName.trim() });
        } catch (err) {
          setError(t('Could not save your classroom. Please check that this browser allows site storage.'));
          setBusy(false);
        }
      };

      const handleFile = (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            const candidate = parsed.classroomData || parsed;
            if (!candidate || !Array.isArray(candidate.students) || !candidate.settings) {
              setError(t('Invalid CLASSPETS backup file format.'));
              return;
            }
            setError('');
            setPendingImport({ fileName: file.name, data: candidate });
          } catch (err) {
            setError(t('Could not read JSON backup file.'));
          }
        };
        reader.readAsText(file);
      };

        setBusy(true);
        try {

    // =========================================================================
    // 6. MAIN CLASSPETS COMMERCIAL APPLICATION
    // =========================================================================
    function App() {
      // Multi-tenant Workspace & License Registry State
      const [licenses, setLicenses] = useState(() => WorkspaceDB.getRegistry());
      const [activeWorkspaceId, setActiveWorkspaceIdRaw] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        const urlWs = params.get('c') || params.get('workspace');
        if (urlWs) return WorkspaceDB.cleanId(urlWs);
        return WorkspaceDB.getRegistry()[0]?.workspaceId || 'CP001';
      });

      // Core Persistent Classroom State
      const [data, setData] = useState(null);
      const [loadError, setLoadError] = useState(null);
      const [loadAttempt, setLoadAttempt] = useState(0);
      const [saveStatus, setSaveStatus] = useState('saved');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedStudentId, setSelectedStudentId] = useState(null);
      const [studentPortalId, setStudentPortalId] = useState(null);

      // UI Overlays & Modals
      const [toast, setToast] = useState(null);
      const [hatchingState, setHatchingState] = useState(null); // { student, eggId, hatchedPet }
      const [confirmDialog, setConfirmDialog] = useState(null); // { title, message, onConfirm, danger }

      // Premium (stored per browser, re-checked with the server on every load when online).
      const [premium, setPremium] = useState(() => Premium.load());
      const [showPremium, setShowPremium] = useState(false);
      const isPremium = !!premium;
      const studentLimit = isPremium ? Infinity : PREMIUM_CONFIG.freeStudentLimit;

      // Language: device preference, overridden by the workspace's saved language once loaded.
      const [lang, setLangState] = useState(CURRENT_LANG);
      CURRENT_LANG = lang; // keep the module-level t() in sync for this render
      useEffect(() => { applyDocumentLang(lang); }, [lang]);

      // First-run detection: null = checking, true = show setup, false = ready.
      const [needsSetup, setNeedsSetup] = useState(() => {
        try { return localStorage.getItem('CLASSPETS_LICENSE_REGISTRY') ? false : null; } catch (e) { return null; }
      });

      // Only an explicitly registered workspace is valid (an unknown ?c= value no longer
      // silently creates a workspace and bypasses the revoked check).
      const activeLicense = useMemo(
        () => licenses.find(l => l.workspaceId === activeWorkspaceId) || null,
        [licenses, activeWorkspaceId]
      );
      const activeLicenseStatus = activeLicense?.status || null;
      const activeLicenseRef = useRef(activeLicense);
      useEffect(() => { activeLicenseRef.current = activeLicense; }, [activeLicense]);

      // ---------------------------------------------------------------------
      // SAVE PIPELINE
      // State updaters stay pure; a debounced effect persists the latest state to the
      // workspace recorded in data.meta.workspaceId. Writes are serialized in WorkspaceDB.
      // ---------------------------------------------------------------------
      const dirtyRef = useRef(false);
      const pendingSaveRef = useRef(null); // { workspaceId, data }
      const saveTimerRef = useRef(null);

      const flushSave = useCallback(() => {
        clearTimeout(saveTimerRef.current);
        saveTimerRef.current = null;
        const pending = pendingSaveRef.current;
        if (!pending) return Promise.resolve();
        pendingSaveRef.current = null;
        return WorkspaceDB.saveState(pending.workspaceId, pending.data)
          .then(() => {
            if (!pendingSaveRef.current) setSaveStatus('saved');
          })
          .catch((err) => {
            console.error('IndexedDB save error:', err);
            setSaveStatus('failed');
          });
      }, []);

      const updateWorkspaceData = useCallback((updater) => {
        dirtyRef.current = true;
        setData(prev => {
          if (!prev) return prev; // ignore edits while a workspace is loading
          return typeof updater === 'function' ? updater(prev) : updater;
        });
      }, []);

      useEffect(() => {
        if (!data || !dirtyRef.current) return;
        dirtyRef.current = false;
        pendingSaveRef.current = { workspaceId: data.meta.workspaceId, data };
        setSaveStatus('saving');
        clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(flushSave, 400);
      }, [data, flushSave]);

      // Flush pending writes when the tab is hidden/closed or the app unmounts.
      useEffect(() => {
        const onHide = () => { if (document.visibilityState === 'hidden') flushSave(); };
        window.addEventListener('pagehide', flushSave);
        document.addEventListener('visibilitychange', onHide);
        return () => {
          window.removeEventListener('pagehide', flushSave);
          document.removeEventListener('visibilitychange', onHide);
          flushSave();
        };
      }, [flushSave]);

      // Switching workspaces: persist pending edits first, then clear everything tied to the
      // old workspace so nothing from it can be written into the new one.
      const setActiveWorkspaceId = useCallback((id) => {
        flushSave();
        dirtyRef.current = false;
        setData(null);
        setLoadError(null);
        setHatchingState(null);
        setConfirmDialog(null);
        setSelectedStudentId(null);
        setStudentPortalId(null);
        setActiveWorkspaceIdRaw(WorkspaceDB.cleanId(id));
      }, [flushSave]);

      const toastTimerRef = useRef(null);
      const showToast = useCallback((message, type = 'success') => {
        clearTimeout(toastTimerRef.current);
        setToast({ message, type, id: Date.now() });
        toastTimerRef.current = setTimeout(() => setToast(null), 3000);
      }, []);

      // Re-verify a stored key (catches revoked keys and hand-edited storage). Network errors keep premium.
      useEffect(() => {
        const stored = Premium.load();
        if (!stored || !Premium.isConfigured()) return;
        let cancelled = false;
        Premium.call('verify', { key: stored.key }).then(res => {
          if (cancelled) return;
          if (res.ok) {
            const next = { ...stored, teacher: res.teacher || stored.teacher, lastCheckedAt: new Date().toISOString() };
            Premium.save(next);
            setPremium(next);
          } else if (['invalid', 'revoked', 'device_not_registered'].includes(res.error)) {
            Premium.clear();
            setPremium(null);
            showToast(premiumErrorText(res.error === 'device_not_registered' ? 'invalid' : res.error), 'error');
          }
        });
        return () => { cancelled = true; };
      }, []);

      const handlePremiumActivated = (state) => {
        Premium.save(state);
        setPremium(state);
        setShowPremium(false);
        showToast(t('Premium activated! You can now add unlimited students.'));
      };

      const handlePremiumDeactivated = () => {
        Premium.clear();
        setPremium(null);
        setShowPremium(false);
        showToast(t('Premium was removed from this device.'), 'info');
      };

      const setLanguage = useCallback((code) => {
        if (!isSupportedLang(code)) return;
        CURRENT_LANG = code;
        persistLang(code);
        setLangState(code);
        updateWorkspaceData(prev => (prev.settings.language === code ? prev : { ...prev, settings: { ...prev.settings, language: code } }));
      }, [updateWorkspaceData]);

      // No registry in localStorage: either a brand-new teacher, or an older version of the app
      // that kept records in IndexedDB without saving the registry. Migrate the latter silently.
      useEffect(() => {
        if (needsSetup !== null) return;
        let cancelled = false;
        (async () => {
          try {
            const legacy = await WorkspaceDB.loadState(DEFAULT_LICENSE.workspaceId);
            if (cancelled) return;
            if (legacy && Array.isArray(legacy.students)) {
              const lic = { ...DEFAULT_LICENSE, customerName: legacy.settings?.teacherName || DEFAULT_LICENSE.customerName };
              WorkspaceDB.saveRegistry([lic]);
              setLicenses([lic]);
              setNeedsSetup(false);
              return;
            }
          } catch (e) {}
          if (!cancelled) setNeedsSetup(true);
        })();
        return () => { cancelled = true; };
      }, [needsSetup]);

      const finishSetup = async (lic, state) => {
        await WorkspaceDB.saveState(lic.workspaceId, state);
        WorkspaceDB.saveRegistry([lic]);
        dirtyRef.current = false;
        setLicenses([lic]);
        setActiveWorkspaceIdRaw(lic.workspaceId);
        setData(null);
        setNeedsSetup(false);
      };

      const makeLocalLicense = (teacherName) => ({
        ...DEFAULT_LICENSE,
        licenseId: `LIC-${new Date().getFullYear()}-CP001-${Math.floor(1000 + Math.random() * 9000)}`,
        customerId: 'CUST-LOCAL',
        customerName: teacherName || DEFAULT_LICENSE.customerName,
        purchaseDate: new Date().toISOString().slice(0, 10)
      });

      const handleSetupCreate = async ({ teacherName, classroomName }) => {
        const lic = makeLocalLicense(teacherName);
        const state = createInitialWorkspaceState(lic, { teacherName, classroomName, language: lang });
        await finishSetup(lic, state);
        showToast(t('Your classroom is ready! Add your students to get started.'));
      };

      const handleSetupImport = async (imported) => {
        const lic = makeLocalLicense(imported.settings?.teacherName || '');
        const state = normalizeWorkspaceState(imported, lic);
        state.settings = { ...state.settings, language: lang };
        state.meta = { ...state.meta, workspaceId: lic.workspaceId, licenseId: lic.licenseId, customerId: lic.customerId, restoredAt: new Date().toISOString() };
        await finishSetup(lic, state);
        showToast(t('Classroom records successfully restored!'));
      };

      // Load the isolated IndexedDB workspace when the workspace (or its license status) changes.
      useEffect(() => {
        let cancelled = false;
        const lic = activeLicenseRef.current;
        if (needsSetup !== false) return; // first-run setup creates the workspace
        if (!lic || lic.status === 'Revoked') return; // guard screens handle these cases

        (async () => {
          try {
            await flushSave(); // make sure no queued edit is newer than what we're about to read
            if (cancelled) return;
            const loaded = await WorkspaceDB.loadState(lic.workspaceId);
            if (cancelled) return;
            let next;
            if (loaded) {
              next = normalizeWorkspaceState(loaded, lic);
            } else {
              next = createInitialWorkspaceState(lic);
              await WorkspaceDB.saveState(lic.workspaceId, next);
              if (cancelled) return;
            }
            dirtyRef.current = false;
            SoundFX.enabled = next.settings.soundEnabled !== false;
            if (isSupportedLang(next.settings.language) && next.settings.language !== CURRENT_LANG) {
              CURRENT_LANG = next.settings.language;
              persistLang(next.settings.language);
              setLangState(next.settings.language);
            }
            setLoadError(null);
            setData(next);
            setSaveStatus('saved');
          } catch (err) {
            console.error('IndexedDB load error:', err);
            // Don't fall back to demo data: the next save would overwrite the real records.
            if (!cancelled) setLoadError(err?.message || String(err));
          }
        })();
        return () => { cancelled = true; };
      }, [activeWorkspaceId, activeLicenseStatus, loadAttempt, flushSave, needsSetup]);

      // Clear selections that point at students who no longer exist (e.g. after delete/restore).
      useEffect(() => {
        if (!data) return;
        const exists = (id) => data.students.some(s => s.id === id);
        if (studentPortalId && !exists(studentPortalId)) setStudentPortalId(null);
        if (selectedStudentId && !exists(selectedStudentId)) setSelectedStudentId(null);
      }, [data, studentPortalId, selectedStudentId]);

      // Escape closes the confirmation dialog.
      useEffect(() => {
        if (!confirmDialog) return;
        const onKey = (e) => { if (e.key === 'Escape') setConfirmDialog(null); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [confirmDialog]);

      // Derived Classroom Analytics
      const stats = useMemo(() => {
        if (!data) return { totalStudents: 0, totalPoints: 0, readyEggs: 0, totalPets: 0 };
        const target = data.settings.pointsPerHatch || 100;
        return {
          totalStudents: data.students.length,
          totalPoints: data.students.reduce((acc, s) => acc + (s.lifetimePoints || 0), 0),
          readyEggs: data.students.filter(s => (s.eggProgress || 0) >= target).length,
          totalPets: data.students.reduce((acc, s) => acc + (s.pets?.length || 0), 0)
        };
      }, [data]);

      // =====================================================================
      // CORE ACTIONS: POINTS, HATCHING, BADGES, STUDENTS
      // =====================================================================
      const awardPointsToStudents = (studentIds, rewardObj, customNote = '') => {
        if (!studentIds.length) return;
        const pts = Number(rewardObj.points) || 0;
        const label = customNote || rewardObj.name;

        if (pts < 0) {
          if (!data.settings.allowDeductions) {
            showToast(t('Point deductions are turned off in Settings.'), 'info');
            return;
          }
          setConfirmDialog({
            title: t('Confirm Point Deduction'),
            message: t('Deduct {n} points ({label}) from {count} student(s)? This lowers egg progress; lifetime points earned are kept.', { n: Math.abs(pts), label: t(label), count: studentIds.length }),
            danger: true,
            onConfirm: () => {
              executePointChange(studentIds, pts, label);
              setConfirmDialog(null);
            }
          });
          return;
        }
        executePointChange(studentIds, pts, label);
      };

      const executePointChange = (studentIds, pts, label) => {
        SoundFX.playPoint();
        const now = new Date().toISOString();

        updateWorkspaceData(prev => {
          const affectedNames = [];
          const updatedStudents = prev.students.map(stu => {
            if (!studentIds.includes(stu.id)) return stu;
            affectedNames.push(stu.name);
            const oldProgress = stu.eggProgress || 0;
            const newProgress = Math.max(0, oldProgress + pts);
            const applied = newProgress - oldProgress; // what actually changed after clamping at 0
            const updatedStu = {
              ...stu,
              // Lifetime points only grow: they record everything a student has earned.
              // Deductions reduce current egg progress instead.
              lifetimePoints: (stu.lifetimePoints || 0) + Math.max(0, pts),
              eggProgress: newProgress,
              history: [
                {
                  id: `tx-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  reason: label,
                  points: applied,
                  requested: applied !== pts ? pts : undefined,
                  type: pts >= 0 ? 'award' : 'deduction',
                  date: now
                },
                ...(stu.history || [])
              ]
            };
            updatedStu.badges = evaluateAutoBadges(updatedStu, prev.badges);
            return updatedStu;
          });

          // Stored as structured data so the feed re-renders in whichever language is active.
          const feedItem = {
            id: `act-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            type: 'points',
            names: affectedNames.slice(0, 3),
            more: Math.max(0, affectedNames.length - 3),
            pts,
            label,
            at: now
          };

          return {
            ...prev,
            students: updatedStudents,
            activityFeed: [feedItem, ...(prev.activityFeed || [])].slice(0, 20)
          };
        });

        showToast(pts >= 0 ? t('+{n} pts awarded for {label}!', { n: pts, label: t(label) }) : t('{n} pts adjusted ({label}).', { n: pts, label: t(label) }), pts >= 0 ? 'success' : 'info');
      };

      // Next egg: continue through the catalog, preferring eggs whose creature the student doesn't own yet.
      const pickNextEgg = (currentEggId, ownedPets) => {
        const n = EGG_CATALOG.length;
        const start = Math.max(0, EGG_CATALOG.findIndex(e => e.id === currentEggId));
        for (let i = 1; i <= n; i++) {
          const egg = EGG_CATALOG[(start + i) % n];
          const pet = CREATURE_CATALOG.find(c => c.eggId === egg.id);
          if (!pet || !ownedPets.includes(pet.id)) return egg;
        }
        return EGG_CATALOG[(start + 1) % n];
      };

      const triggerEggHatch = (studentArg) => {
        if (hatchingState) return;
        const student = data.students.find(s => s.id === studentArg.id) || studentArg; // use latest data
        const target = data.settings.pointsPerHatch || 100;
        if ((student.eggProgress || 0) < target) {
          showToast(t('{name} needs {n} more points to hatch!', { name: student.name, n: target - (student.eggProgress || 0) }), 'info');
          return;
        }

        // The egg's own creature, unless already owned; then a random unowned creature.
        const owned = student.pets || [];
        const matching = CREATURE_CATALOG.find(c => c.eggId === student.currentEggId);
        const unowned = CREATURE_CATALOG.filter(c => !owned.includes(c.id));
        const randomOf = (list) => list[Math.floor(Math.random() * list.length)];
        const chosenPet = matching && !owned.includes(matching.id)
          ? matching
          : unowned.length ? randomOf(unowned) : (matching || randomOf(CREATURE_CATALOG));

        setHatchingState({
          student,
          eggId: student.currentEggId || 'strawberry',
          hatchedPet: chosenPet
        });
      };

      const completeEggHatch = (hatchedPet) => {
        if (!hatchingState) return;
        const { student } = hatchingState;
        const now = new Date().toISOString();

        updateWorkspaceData(prev => {
          const target = prev.settings.pointsPerHatch || 100;
          const updatedStudents = prev.students.map(s => {
            if (s.id !== student.id) return s;
            const nextPets = Array.from(new Set([...(s.pets || []), hatchedPet.id]));
            const updatedStu = {
              ...s,
              eggProgress: Math.max(0, (s.eggProgress || 0) - target),
              hatchedCount: (s.hatchedCount || 0) + 1,
              pets: nextPets,
              activePetId: hatchedPet.id,
              currentEggId: pickNextEgg(s.currentEggId, nextPets).id,
              history: [
                {
                  id: `tx-hatch-${Date.now()}`,
                  reason: `Hatched ${hatchedPet.name}!`,
                  points: 0,
                  type: 'hatch',
                  petId: hatchedPet.id,
                  date: now
                },
                ...(s.history || [])
              ]
            };
            updatedStu.badges = evaluateAutoBadges(updatedStu, prev.badges);
            return updatedStu;
          });

          return {
            ...prev,
            students: updatedStudents,
            activityFeed: [
              {
                id: `act-hatch-${Date.now()}`,
                type: 'hatch',
                name: student.name,
                petId: hatchedPet.id,
                at: now
              },
              ...(prev.activityFeed || [])
            ].slice(0, 20)
          };
        });

        setHatchingState(null);
        showToast(t("{pet} joined {name}'s collection!", { pet: t(hatchedPet.name), name: student.name }));
      };

      // Overlays shared by every screen (main shell, projector mode, student view).
      const toastStyles = {
        success: 'border-pink-400/50',
        info: 'border-sky-400/60',
        error: 'border-rose-500'
      };
      const overlays = (
        <>
          {showPremium && (
            <PremiumModal
              premium={premium}
              studentCount={data ? data.students.length : 0}
              teacherName={data ? data.settings.teacherName : ''}
              onActivated={handlePremiumActivated}
              onDeactivated={handlePremiumDeactivated}
              onClose={() => setShowPremium(false)}
            />
          )}
          {hatchingState && (
            <EggHatchingCeremony
              student={hatchingState.student}
              eggId={hatchingState.eggId}
              hatchedPet={hatchingState.hatchedPet}
              onComplete={completeEggHatch}
            />
          )}

          {/* Custom Confirmation Dialog (Never uses window.confirm) */}
          {confirmDialog && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
              <div className="glass-card max-w-md w-full rounded-3xl p-6 space-y-4 text-slate-800">
                <h3 id="confirm-title" className="font-display text-xl font-bold text-slate-800">{confirmDialog.title}</h3>
                <p className="text-sm text-slate-600 leading-relaxed">{confirmDialog.message}</p>
                <div className="flex justify-end gap-3 pt-2">
                  <button
                    autoFocus
                    onClick={() => setConfirmDialog(null)}
                    className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm cursor-pointer"
                  >
                    {t("Cancel")}
                  </button>
                  <button
                    onClick={confirmDialog.onConfirm}
                    className={`px-5 py-2 rounded-xl text-white font-bold text-sm cursor-pointer ${
                      confirmDialog.danger ? 'bg-rose-500 hover:bg-rose-600' : 'bg-pink-500 hover:bg-pink-600'
                    }`}
                  >
                    {t("Confirm")}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Celebration Toast Notification */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-[70] animate-bounce" role="status" aria-live="polite">
              <div className={`px-5 py-3 rounded-2xl bg-slate-900/95 text-white font-bold text-sm shadow-xl border flex items-center gap-2.5 ${toastStyles[toast.type] || toastStyles.success}`}>
                <span className={`w-2.5 h-2.5 rounded-full ${toast.type === 'error' ? 'bg-rose-400' : toast.type === 'info' ? 'bg-sky-400' : 'bg-amber-400'}`} />
                <span>{toast.message}</span>
              </div>
            </div>
          )}
        </>
      );

      const firstActiveWorkspace = licenses.find(l => l.status === 'Active' && l.workspaceId !== activeWorkspaceId);

      if (needsSetup === null) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
            <CustomEggSVG eggId="rainbow" progress={75} size={130} />
            <h1 className="font-display text-3xl font-bold text-pink-600 mt-4">{t('Loading Magical Workspace…')}</h1>
          </div>
        );
      }

      if (needsSetup) {
        return (
          <>
            <FirstRunSetup lang={lang} onLanguageChange={setLanguage} onCreate={handleSetupCreate} onImport={handleSetupImport} />
            {overlays}
          </>
        );
      }

      // Unknown workspace (e.g. a mistyped or unlicensed ?c= link)
      if (!activeLicense) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6">
            <div className="glass-card max-w-md w-full rounded-3xl p-8 text-center space-y-4">
              <div className="w-16 h-16 rounded-2xl bg-amber-100 text-amber-700 mx-auto flex items-center justify-center font-display text-2xl font-bold">?</div>
              <h2 className="font-display text-2xl font-bold text-slate-800">{t("Workspace Not Found")}</h2>
              <p className="text-sm text-slate-600">
                {tRich("Workspace {id} isn't registered on this device.", { id: <strong>{activeWorkspaceId}</strong> })}
              </p>
              {firstActiveWorkspace && (
                <button
                  onClick={() => setActiveWorkspaceId(firstActiveWorkspace.workspaceId)}
                  className="px-5 py-2.5 rounded-xl bg-pink-500 hover:bg-pink-600 text-white font-bold text-sm cursor-pointer"
                >
                  {t("Open Workspace")}{' '}{firstActiveWorkspace.workspaceId}
                </button>
              )}
            </div>
          </div>
        );
      }

      // License Revoked Lockout Check
      if (activeLicense.status === 'Revoked') {
        return (
          <div className="min-h-screen flex items-center justify-center p-6">
            <div className="glass-card max-w-md w-full rounded-3xl p-8 text-center space-y-4">
              <div className="w-16 h-16 rounded-2xl bg-rose-100 text-rose-600 mx-auto flex items-center justify-center font-display text-2xl font-bold">!</div>
              <h2 className="font-display text-2xl font-bold text-slate-800">{t("License Access Suspended")}</h2>
              <p className="text-sm text-slate-600">
                {tRich("License {license} ({ws}) is currently marked as Revoked.", { license: <strong>{activeLicense.licenseId}</strong>, ws: activeLicense.workspaceId })}
              </p>
              {firstActiveWorkspace && (
                <button
                  onClick={() => setActiveWorkspaceId(firstActiveWorkspace.workspaceId)}
                  className="px-5 py-2.5 rounded-xl bg-pink-500 hover:bg-pink-600 text-white font-bold text-sm cursor-pointer"
                >
                  {t("Switch to Active Workspace")}
                </button>
              )}
            </div>
          </div>
        );
      }

      if (loadError) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6">
            <div className="glass-card max-w-md w-full rounded-3xl p-8 text-center space-y-4">
              <h2 className="font-display text-2xl font-bold text-slate-800">{t("Couldn't Open Classroom Records")}</h2>
              <p className="text-sm text-slate-600">
                {t("Browser storage for {db} isn't available ({error}). Private/incognito windows and some browser settings block it. Your saved records were not changed.", { db: WorkspaceDB.getDbName(activeWorkspaceId), error: loadError })}
              </p>
              <button
                onClick={() => { setLoadError(null); setLoadAttempt(n => n + 1); }}
                className="px-5 py-2.5 rounded-xl bg-pink-500 hover:bg-pink-600 text-white font-bold text-sm cursor-pointer"
              >
                {t("Try Again")}
              </button>
            </div>
          </div>
        );
      }

      if (!data) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
            <CustomEggSVG eggId="rainbow" progress={75} size={130} />
            <h1 className="font-display text-3xl font-bold text-pink-600 mt-4">{t("Loading Magical Workspace…")}</h1>
            <p className="text-slate-500 mt-1">{t("Connecting to isolated IndexedDB storage ({db})", { db: WorkspaceDB.getDbName(activeWorkspaceId) })}</p>
          </div>
        );
      }

      // =====================================================================
      // STUDENT INDIVIDUAL PORTAL VIEW (Teacher-Controlled Selection, No Admin Controls)
      // =====================================================================
      const portalStudent = studentPortalId ? data.students.find(s => s.id === studentPortalId) : null;
      if (portalStudent) {
        const stu = portalStudent;
        const target = data.settings.pointsPerHatch || 100;
        const pct = Math.min(100, Math.round(((stu.eggProgress || 0) / target) * 100));
        const selectPortalPet = (pet) => {
          updateWorkspaceData(prev => ({
            ...prev,
            students: prev.students.map(s => s.id === stu.id ? { ...s, activePetId: pet.id } : s)
          }));
          showToast(t('{pet} is now your active buddy!', { pet: t(pet.name) }));
        };

        return (
          <div className="min-h-screen pb-16 px-4 pt-6 max-w-4xl mx-auto">
            {overlays}
            {/* Safe Return Bar for Teacher */}
            <div className="flex items-center justify-between mb-6 glass-card rounded-2xl px-4 py-3">
              <div className="flex items-center gap-2">
                <span className="px-3 py-1 rounded-full bg-sky-100 text-sky-700 font-bold text-xs">{t("STUDENT VIEW")}</span>
                <span className="font-display font-bold text-slate-700">{data.settings.classroomName}</span>
              </div>
              <button
                onClick={() => setStudentPortalId(null)}
                className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs sm:text-sm transition cursor-pointer"
              >
                {t("Exit Student View")}
              </button>
            </div>

            {/* Student Hero Card */}
            <div className="glass-card rounded-3xl p-6 sm:p-8 text-center relative overflow-hidden mb-6">
              <div className="inline-block px-4 py-1 rounded-full bg-pastel-yellow text-amber-800 font-bold text-xs mb-2">
                {t("Student #{n}", { n: stu.number })}
              </div>
              <h1 className="font-display text-3xl sm:text-4xl font-extrabold text-slate-800">{t("{name}’s Magical Sanctuary", { name: stu.name })}</h1>
              <p className="text-slate-500 text-sm mt-1">{t("Keep earning points to hatch new ClassPet friends!")}</p>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center mt-8">
                {/* Current Egg Incubator */}
                <div className="bg-white/80 rounded-3xl p-6 border-2 border-pink-100 flex flex-col items-center">
                  <span className="text-xs font-extrabold uppercase tracking-wider text-pink-500 mb-2">{t("Current Egg Incubator")}</span>
                  <CustomEggSVG eggId={stu.currentEggId} progress={stu.eggProgress} target={target} size={140} />
                  <p className="font-display font-bold text-lg text-slate-800 mt-3">
                    {t(EGG_CATALOG.find(e => e.id === stu.currentEggId)?.name || "Magical Egg")}
                  </p>
                  <div className="w-full h-4 bg-slate-100 rounded-full overflow-hidden p-0.5 mt-3">
                    <div
                      className="h-full rounded-full bg-gradient-to-r from-pink-400 via-amber-400 to-emerald-400 transition-all duration-500"
                      style={{ width: `${pct}%` }}
                    />
                  </div>
                  <p className="text-sm font-bold text-slate-600 mt-2">
                    {t("{progress} / {target} Points ({pct}%)", { progress: stu.eggProgress, target, pct })}
                  </p>
                </div>

                {/* Active Companion & Stats */}
                <div className="bg-white/80 rounded-3xl p-6 border-2 border-purple-100 flex flex-col items-center">
                  <span className="text-xs font-extrabold uppercase tracking-wider text-purple-500 mb-2">{t("Active Companion")}</span>
                  {stu.activePetId ? (
                    <>
                      <CustomCreatureSVG creatureId={stu.activePetId} size={140} mood="happy" />
                      <p className="font-display font-bold text-lg text-slate-800 mt-3">
                        {t(CREATURE_CATALOG.find(c => c.id === stu.activePetId)?.name || "")}
                      </p>
                      <p className="text-xs text-slate-500">
                        {t(CREATURE_CATALOG.find(c => c.id === stu.activePetId)?.personality || "")}
                      </p>
                    </>
                  ) : (
                    <div className="py-10 text-center text-slate-400">
                      <p className="font-display font-bold text-base">{t("No active pet yet!")}</p>
                      <p className="text-xs mt-1">{t("Reach {target} points to hatch your first egg.", { target })}</p>
                    </div>
                  )}
                  <div className="grid grid-cols-2 gap-3 w-full mt-4 pt-4 border-t border-slate-100">
                    <div className="bg-amber-50 rounded-2xl p-2.5">
                      <div className="font-display text-xl font-bold text-amber-600">{stu.lifetimePoints}</div>
                      <div className="text-xs font-bold text-slate-500">{t("Lifetime Points")}</div>
                    </div>
                    <div className="bg-emerald-50 rounded-2xl p-2.5">
                      <div className="font-display text-xl font-bold text-emerald-600">{stu.pets?.length || 0}</div>
                      <div className="text-xs font-bold text-slate-500">{t("Friends Hatched")}</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Student's Collected Pets */}
            <div className="glass-card rounded-3xl p-6 mb-6">
              <h2 className="font-display text-xl font-bold text-slate-800 mb-4">{t("My Collected Friends ({n}/12)", { n: stu.pets?.length || 0 })}</h2>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                {CREATURE_CATALOG.map(pet => {
                  const unlocked = (stu.pets || []).includes(pet.id);
                  return (
                    <div
                      key={pet.id}
                      role={unlocked ? 'button' : undefined}
                      tabIndex={unlocked ? 0 : undefined}
                      aria-label={unlocked ? t("Make {name} your active buddy", { name: t(pet.name) }) : t("Locked friend")}
                      onKeyDown={unlocked ? onActivateKey(() => selectPortalPet(pet)) : undefined}
                      onClick={() => { if (unlocked) selectPortalPet(pet); }}
                      className={`rounded-2xl p-4 text-center border-2 transition ${
                        unlocked
                          ? 'bg-white border-pink-200 hover:border-pink-400 cursor-pointer shadow-sm'
                          : 'bg-slate-50/70 border-slate-200/60'
                      }`}
                    >
                      <CustomCreatureSVG creatureId={pet.id} size={82} mood={unlocked ? 'idle' : 'sleep'} locked={!unlocked} />
                      <p className="font-display font-bold text-sm text-slate-800 mt-2">{unlocked ? pet.name : '???'}</p>
                      <span className="inline-block mt-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-purple-100 text-purple-700">
                        {t(pet.rarity)}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Student's Achievements & Recent History */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="glass-card rounded-3xl p-6">
                <h2 className="font-display text-xl font-bold text-slate-800 mb-4">{t("My Achievement Badges ({n})", { n: stu.badges?.length || 0 })}</h2>
                {(stu.badges || []).length === 0 ? (
                  <p className="text-sm text-slate-400">{t("Earn points and hatch eggs to unlock shiny badges!")}</p>
                ) : (
                  <div className="space-y-3">
                    {stu.badges.map(bId => {
                      const badge = data.badges.find(b => b.id === bId);
                      if (!badge) return null;
                      return (
                        <div key={bId} className="flex items-center gap-3 bg-white/90 p-3 rounded-2xl border border-amber-100">
                          <BadgeMedalSVG color={badge.color} size={44} />
                          <div>
                            <p className="font-display font-bold text-sm text-slate-800">{t(badge.name)}</p>
                            <p className="text-xs text-slate-500">{t(badge.description)}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              <div className="glass-card rounded-3xl p-6">

    // =========================================================================
    // VIEW 2: STUDENT MANAGEMENT & INDIVIDUAL STUDENT PROFILE
    // =========================================================================
    function StudentsView({
      data,
      selectedStudentId,
      setSelectedStudentId,
      onUpdateData,
      onAwardPoints,
      onHatchEgg,
      onOpenStudentPortal,
      showToast,
      setConfirmDialog,
      studentLimit = Infinity,
      isPremium = false,
      onOpenPremium = () => {}
    }) {
      const [search, setSearch] = useState('');
      const remainingSlots = Math.max(0, studentLimit - data.students.length);
      const atLimit = remainingSlots === 0;
      const [newName, setNewName] = useState('');
      const [newNumber, setNewNumber] = useState('');
      const [showBulkModal, setShowBulkModal] = useState(false);
      const [bulkText, setBulkText] = useState('');
      const [editingStudent, setEditingStudent] = useState(null);

      const target = data.settings.pointsPerHatch || 100;

      const filteredStudents = useMemo(() => {
        return [...data.students]
          .sort((a, b) => (a.number || 0) - (b.number || 0))
          .filter(s =>
            s.name.toLowerCase().includes(search.toLowerCase()) ||
            String(s.number).includes(search)
          );
      }, [data.students, search]);

      const handleAddStudent = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;
        if (atLimit) {
          showToast(t('The free plan allows up to {limit} students. Activate Premium to add more.', { limit: studentLimit }), 'info');
          onOpenPremium();
          return;
        }
        const requested = newNumber === '' ? null : Number(newNumber);
        if (requested !== null && (!Number.isInteger(requested) || requested < 1)) {
          showToast(t('Student number must be a whole number of 1 or more.'), 'error');
          return;
        }
        if (requested !== null && data.students.some(s => s.number === requested)) {
          showToast(t('Student #{n} already exists.', { n: requested }), 'error');
          return;
        }
        const nextNum = requested ?? (data.students.reduce((m, s) => Math.max(m, s.number || 0), 0) + 1);
        const randomEgg = EGG_CATALOG[data.students.length % EGG_CATALOG.length];
        const studentObj = {
          id: `stu-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          number: nextNum,
          name: newName.trim(),
          lifetimePoints: 0,
          eggProgress: 0,
          currentEggId: randomEgg.id,
          hatchedCount: 0,
          pets: [],
          activePetId: null,
          badges: [],
          history: []
        };
        onUpdateData(prev => ({
          ...prev,
          students: [...prev.students, studentObj]
        }));
        setNewName('');
        setNewNumber('');
        showToast(t('{name} added to classroom!', { name: studentObj.name }));
      };

      const handleBulkImport = () => {
        const lines = bulkText
          .split(/\r?\n/)
          .map(l => l.trim())
          .filter(Boolean);
        if (!lines.length) return;
        if (atLimit) {
          setShowBulkModal(false);
          showToast(t('The free plan allows up to {limit} students. Activate Premium to add more.', { limit: studentLimit }), 'info');
          onOpenPremium();
          return;
        }
        const accepted = lines.slice(0, remainingSlots);
        let maxNum = data.students.reduce((m, s) => Math.max(m, s.number || 0), 0);
        const added = accepted.map((line, idx) => {
          maxNum += 1;
          const cleanName = line.replace(/^\d+[\.\)\-\s]+/, '').trim() || line;
          return {
            id: `stu-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 5)}`,
            number: maxNum,
            name: cleanName,
            lifetimePoints: 0,
            eggProgress: 0,
            currentEggId: EGG_CATALOG[(data.students.length + idx) % EGG_CATALOG.length].id,
            hatchedCount: 0,
            pets: [],
            activePetId: null,
            badges: [],
            history: []
          };
        });
        onUpdateData(prev => ({
          ...prev,
          students: [...prev.students, ...added]
        }));
        setBulkText('');
        setShowBulkModal(false);
        if (accepted.length < lines.length) {
          showToast(t('Added {n} of {total} students. The free plan allows up to {limit} — activate Premium to add the rest.', { n: added.length, total: lines.length, limit: studentLimit }), 'info');
          onOpenPremium();
        } else {
          showToast(t('Imported {n} students!', { n: added.length }));
        }
      };

      const handleDeleteStudent = (stu) => {
        setConfirmDialog({
          title: t('Remove Student'),
          message: t('Are you sure you want to delete {name} (#{n}) and their pet records?', { name: stu.name, n: stu.number }),
          danger: true,
          onConfirm: () => {
            onUpdateData(prev => ({
              ...prev,
              students: prev.students.filter(s => s.id !== stu.id)
            }));
            if (selectedStudentId === stu.id) setSelectedStudentId(null);
            setConfirmDialog(null);
            showToast(t('{name} removed.', { name: stu.name }));
          }
        });
      };

      // Detailed Individual Student Profile View
      const selectedStu = selectedStudentId ? data.students.find(s => s.id === selectedStudentId) : null;
      if (selectedStu) {

        const pct = Math.min(100, Math.round(((stu.eggProgress || 0) / target) * 100));

        return (

            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <form onSubmit={handleAddStudent} className="md:col-span-2 flex flex-wrap sm:flex-nowrap gap-2">

            {filteredStudents.map(stu => {
              const pct = Math.min(100, Math.round(((stu.eggProgress || 0) / target) * 100));

              return (
                <div

                  className="glass-card rounded-3xl p-5 flex flex-col justify-between hover:border-pink-300 transition-all group"

                  <div>

                      <span className="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 font-extrabold text-xs">
                        #{stu.number}
                      </span>
                      <div className="flex items-center gap-1">
                        <button
                          onClick={() => setEditingStudent({ ...stu })}
                          className="px-2 py-1 rounded-lg bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-800 text-xs font-bold cursor-pointer"
                        >
                          {t("Edit")}
                        </button>
                        <button
                          onClick={() => handleDeleteStudent(stu)}
                          className="px-2 py-1 rounded-lg bg-slate-100 hover:bg-rose-100 text-slate-600 hover:text-rose-700 text-xs font-bold cursor-pointer"
