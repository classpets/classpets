    function EditStudentModal({ student, takenNumbers = [], onClose, onSave }) {
      const [name, setName] = useState(student.name);
      const [number, setNumber] = useState(String(student.number ?? ''));
      const [eggId, setEggId] = useState(student.currentEggId);
      const parsedNumber = Number(number);
      const numberError = number === '' || !Number.isInteger(parsedNumber) || parsedNumber < 1
        ? t('Enter a whole number of 1 or more.')
        : takenNumbers.includes(parsedNumber)
        ? t('Student #{n} already exists.', { n: parsedNumber })
        : null;

      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4" role="dialog" aria-modal="true" aria-labelledby="edit-student-title">
          <div className="glass-card max-w-md w-full rounded-3xl p-6 space-y-4">
            <h3 id="edit-student-title" className="font-display text-xl font-bold text-slate-800">{t("Edit Student Information")}</h3>
            <div className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-500 mb-1">{t("Student Number")}</label>
                <input
                  type="number"
                  min="1"
                  value={number}
                  onChange={e => setNumber(e.target.value)}
                  aria-invalid={!!numberError}
                  className={`w-full px-3.5 py-2 rounded-xl border bg-white font-bold text-sm ${numberError ? 'border-rose-400' : 'border-slate-200'}`}
                />
                {numberError && <p className="text-xs font-bold text-rose-600 mt-1">{numberError}</p>}
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-500 mb-1">{t("Student Name")}</label>
                <input
                  type="text"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-white font-bold text-sm"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-500 mb-1">{t("Assigned Incubating Egg")}</label>
                <select
                  value={eggId}
                  onChange={e => setEggId(e.target.value)}
                  className="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-white font-bold text-sm"
                >
                  {EGG_CATALOG.map(e => (
                    <option key={e.id} value={e.id}>{t(e.name)}</option>
                  ))}
                </select>
              </div>
            </div>
            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-100 font-bold text-sm text-slate-600 cursor-pointer">
                {t("Cancel")}
              </button>
              <button
                disabled={!!numberError}
                onClick={() => onSave({ ...student, name: name.trim() || student.name, number: parsedNumber, currentEggId: eggId })}
                className="px-5 py-2 rounded-xl bg-pink-500 text-white font-display font-bold text-sm cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
              >
                {t("Save Changes")}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // VIEW 3: REWARD CENTER (Multi-Select Awarding, Deductions & Custom Categories)
    // =========================================================================
    function RewardCenterView({ data, onUpdateData, onAwardPoints, showToast }) {
      const [selectedIds, setSelectedIds] = useState([]);
      const [newRewardName, setNewRewardName] = useState('');
      const [newRewardPts, setNewRewardPts] = useState(10);
      const [editingRewardId, setEditingRewardId] = useState(null);
      const [rewardDraft, setRewardDraft] = useState({ name: '', points: '' });

      // Drop selections for students that no longer exist.
      const validSelectedIds = selectedIds.filter(id => data.students.some(s => s.id === id));

      const startEditReward = (rew) => {
        setEditingRewardId(rew.id);
        setRewardDraft({ name: rew.name, points: String(rew.points) });
      };

      // Edits are committed once on "Done" instead of rewriting storage on every keystroke.
      const commitRewardEdit = () => {
        const name = rewardDraft.name.trim();
        const points = Number(rewardDraft.points);
        if (!name || rewardDraft.points === '' || !Number.isFinite(points) || points === 0) {
          showToast(t('Reward needs a name and a non-zero point value.'), 'error');
          return;
        }
        onUpdateData(prev => ({
          ...prev,
          rewards: prev.rewards.map(r => r.id === editingRewardId ? { ...r, name, points } : r)
        }));
        setEditingRewardId(null);
        showToast(t('Reward updated!'));
      };

      const toggleStudent = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const selectAll = () => {
        if (validSelectedIds.length === data.students.length) setSelectedIds([]);
        else setSelectedIds(data.students.map(s => s.id));
      };

      const handleAddReward = (e) => {
        e.preventDefault();
        if (!newRewardName.trim()) return;
        const pts = Number(newRewardPts);
        if (newRewardPts === '' || !Number.isFinite(pts) || pts === 0) {
          showToast(t('Enter a non-zero point value.'), 'error');
          return;
        }
        const colors = [
          'bg-pink-100 text-pink-800 border-pink-300',
          'bg-sky-100 text-sky-800 border-sky-300',
          'bg-emerald-100 text-emerald-800 border-emerald-300',
          'bg-amber-100 text-amber-800 border-amber-300',
          'bg-purple-100 text-purple-800 border-purple-300'
        ];
        const created = {
          id: `rew-${Date.now()}`,
          name: newRewardName.trim(),
          points: pts,
          color: colors[data.rewards.length % colors.length]
        };
        onUpdateData(prev => ({
          ...prev,
          rewards: [...prev.rewards, created]
        }));
        setNewRewardName('');
        setNewRewardPts(10);
        showToast(t('Reward "{name}" created!', { name: created.name }));
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Left: Select One or Multiple Students */}
            <div className="lg:col-span-2 glass-card rounded-3xl p-6">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                <div>
                  <h1 className="font-display text-2xl font-extrabold text-slate-800">{t("1. Select Student(s)")}</h1>
                  <p className="text-xs text-slate-500">{t("Tap one student or select multiple students to reward together.")}</p>
                </div>
                <button
                  onClick={selectAll}
                  className="px-4 py-2 rounded-xl bg-pastel-lavender hover:bg-purple-200 text-purple-900 font-bold text-xs cursor-pointer"
                >
                  {validSelectedIds.length === data.students.length ? t("Deselect All") : t("Select Whole Class ({n})", { n: data.students.length })}
                </button>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                {data.students.map(stu => {
                  const isSelected = validSelectedIds.includes(stu.id);
                  return (
                    <button
                      key={stu.id}
                      onClick={() => toggleStudent(stu.id)}
                      className={`p-3.5 rounded-2xl border-2 text-left transition-all cursor-pointer ${
                        isSelected
                          ? 'bg-pink-50 border-pink-500 shadow-md scale-[1.02]'
                          : 'bg-white/85 border-slate-100 hover:border-pink-200'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-extrabold text-slate-400">#{stu.number}</span>
                        <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold ${isSelected ? 'bg-pink-500 text-white' : 'bg-slate-100 text-transparent'}`}>
                          ✓
                        </span>
                      </div>
                      <p className="font-display font-bold text-sm text-slate-800 truncate mt-1">{stu.name}</p>
                      <p className="text-xs font-bold text-amber-600 mt-0.5">{t("{n} pts", { n: stu.lifetimePoints })}</p>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Right: Click Reward Category to Award */}
            <div className="glass-card rounded-3xl p-6 space-y-4">
              <div>
                <h2 className="font-display text-2xl font-extrabold text-slate-800">{t("2. Award Points")}</h2>
                <p className="text-xs text-slate-500">
                  {validSelectedIds.length === 0
                    ? t("Select at least 1 student on the left first.")
                    : t("Ready to award {n} selected student(s)!", { n: validSelectedIds.length })}
                </p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2.5">
                {data.rewards.map(rew => (
                  <button
                    key={rew.id}
                    disabled={validSelectedIds.length === 0}
                    onClick={() => onAwardPoints(validSelectedIds, rew)}
                    className={`p-3.5 rounded-2xl border-2 flex items-center justify-between transition cursor-pointer disabled:opacity-45 disabled:cursor-not-allowed ${rew.color}`}
                  >
                    <span className="font-display font-bold text-sm">{t(rew.name)}</span>
                    <span className="px-2.5 py-1 rounded-xl bg-white/80 font-display font-extrabold text-sm">
                      {rew.points > 0 ? `+${rew.points}` : rew.points}
                    </span>
                  </button>
                ))}
              </div>

              {data.settings.allowDeductions && (
                <div className="pt-3 border-t border-slate-100">
                  <button
                    disabled={validSelectedIds.length === 0}
                    onClick={() => onAwardPoints(validSelectedIds, { name: 'Point Adjustment', points: -5 })}
                    className="w-full py-2.5 px-4 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 font-bold text-xs disabled:opacity-40 cursor-pointer"
                  >
                    {t("Deduct -5 Points (Requires Confirmation)")}
                  </button>
                </div>
              )}
            </div>
          </div>

          {/* Customize Reward Categories Section */}
          <div className="glass-card rounded-3xl p-6">
            <h2 className="font-display text-xl font-bold text-slate-800 mb-1">{t("Customize Classroom Rewards")}</h2>
            <p className="text-xs text-slate-500 mb-4">{t("Edit reward names, change point values, or create custom classroom behaviors.")}</p>

            <form onSubmit={handleAddReward} className="flex flex-wrap gap-2 mb-5">
              <input
                type="text"
                placeholder={t("New reward activity (e.g. Clean Desk)")}
                value={newRewardName}
                onChange={e => setNewRewardName(e.target.value)}
                className="flex-1 min-w-[200px] px-4 py-2.5 rounded-xl border border-pink-200 bg-white text-sm font-semibold"
              />
              <input
                type="number"
                value={newRewardPts}
                onChange={e => setNewRewardPts(e.target.value)}
                className="w-24 px-3 py-2.5 rounded-xl border border-pink-200 bg-white text-sm font-bold"
              />
              <button
                type="submit"
                className="px-5 py-2.5 rounded-xl bg-pink-500 hover:bg-pink-600 text-white font-display font-bold text-sm cursor-pointer"
              >
                {t("+ Add Custom Reward")}
              </button>
            </form>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              {data.rewards.map(rew => (
                <div key={rew.id} className="bg-white/90 rounded-2xl p-3.5 border border-slate-200 flex flex-col justify-between gap-2">
                  {editingRewardId === rew.id ? (
                    <div className="space-y-2">
                      <input
                        type="text"
                        aria-label={t("Reward name")}
                        value={rewardDraft.name}
                        onChange={e => setRewardDraft(d => ({ ...d, name: e.target.value }))}
                        className="w-full px-2.5 py-1.5 rounded-lg border text-xs font-bold"
                      />
                      <input
                        type="number"
                        aria-label={t("Reward points")}
                        value={rewardDraft.points}
                        onChange={e => setRewardDraft(d => ({ ...d, points: e.target.value }))}
                        className="w-full px-2.5 py-1.5 rounded-lg border text-xs font-bold"
                      />
                      <div className="flex gap-1.5">
                        <button
                          onClick={commitRewardEdit}
                          className="flex-1 py-1 rounded-lg bg-emerald-500 text-white text-xs font-bold cursor-pointer"
                        >
                          {t("Done")}
                        </button>
                        <button
                          onClick={() => setEditingRewardId(null)}
                          className="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold cursor-pointer"
                        >
                          {t("Cancel")}
                        </button>
                      </div>
                    </div>
                  ) : (
                    <>
                      <div className="flex items-start justify-between gap-2">
                        <span className="font-bold text-sm text-slate-800">{t(rew.name)}</span>
                        <span className="font-display font-extrabold text-sm text-pink-600">
                          {rew.points > 0 ? `+${rew.points}` : rew.points}
                        </span>
                      </div>
                      <div className="flex gap-1.5 pt-2 border-t border-slate-100">
                        <button
                          onClick={() => startEditReward(rew)}
                          className="flex-1 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-600 cursor-pointer"
                        >
                          {t("Edit")}
                        </button>
                        {data.rewards.length > 1 && (
                          <button
                            onClick={() => {
                              onUpdateData(prev => ({
                                ...prev,
                                rewards: prev.rewards.filter(r => r.id !== rew.id)
                              }));
                              showToast(t('Reward category removed.'));
                            }}
                            className="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-xs font-bold text-rose-600 cursor-pointer"
                          >
                            {t("Delete")}
                          </button>
                        )}
                      </div>
                    </>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // VIEW 4: MAGICAL EGG HATCHERY (12 Original Illustrated Eggs & Student Incubators)
    // =========================================================================
    function EggHatcheryView({ data, onUpdateData, onHatchEgg, showToast }) {
      const target = data.settings.pointsPerHatch || 100;

      const getStageText = (pts) => {
        const pct = Math.round((pts / target) * 100);
        if (pct >= 100) return t("READY TO HATCH!");
        if (pct >= 75) return t("Visible cracks appearing!");
        if (pct >= 50) return t("Egg is shaking excitedly!");
        if (pct >= 25) return t("Egg is glowing warmly!");
        return t("Egg resting in nest");
      };

      return (
        <div className="space-y-8">
          {/* Student Incubators */}
          <div className="glass-card rounded-3xl p-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-5">
              <div>
                <h1 className="font-display text-2xl sm:text-3xl font-extrabold text-slate-800">{t("Classroom Egg Incubators")}</h1>
                <p className="text-sm text-slate-500">{tRich("Current Hatching Goal: {goal} per egg.", { goal: <strong>{t("{n} points", { n: target })}</strong> })}</p>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {data.students.map(stu => {
                const pct = Math.min(100, Math.round(((stu.eggProgress || 0) / target) * 100));
                const ready = (stu.eggProgress || 0) >= target;
                return (
                  <div
                    key={stu.id}
                    className={`rounded-3xl p-5 text-center border-2 transition ${
                      ready ? 'bg-gradient-to-b from-amber-50 to-pink-50 border-amber-400 shadow-lg' : 'bg-white/90 border-pink-100'
                    }`}
                  >
                    <p className="font-display font-bold text-lg text-slate-800">{stu.name}</p>
                    <p className="text-xs font-extrabold text-pink-500 mb-2">{getStageText(stu.eggProgress || 0)}</p>

                    <CustomEggSVG eggId={stu.currentEggId} progress={stu.eggProgress} target={target} size={115} />

                    <select
                      value={stu.currentEggId}
                      onChange={(e) => {
                        const val = e.target.value;
                        onUpdateData(prev => ({
                          ...prev,
                          students: prev.students.map(s => s.id === stu.id ? { ...s, currentEggId: val } : s)
                        }));
                        showToast(t("Changed {name}'s egg!", { name: stu.name }));
                      }}
                      className="mt-3 w-full px-2.5 py-1.5 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-700"
                    >
                      {EGG_CATALOG.map(egg => (
                        <option key={egg.id} value={egg.id}>{t(egg.name)}</option>
                      ))}
                    </select>

                    <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden mt-3">
                      <div className="h-full bg-gradient-to-r from-pink-400 via-amber-400 to-emerald-400" style={{ width: `${pct}%` }} />
                    </div>
                    <p className="text-xs font-bold text-slate-600 mt-1">{t("{progress} / {target} pts ({pct}%)", { progress: stu.eggProgress, target, pct })}</p>

                    {ready && (
                      <button
                        onClick={() => onHatchEgg(stu)}
                        className="mt-3 w-full py-2.5 rounded-2xl bg-gradient-to-r from-pink-500 to-amber-500 text-white font-display font-bold text-sm shadow-md animate-bounce cursor-pointer"
                      >
                        {t("HATCH EGG NOW!")}
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* 12 Original Illustrated Eggs Showcase */}
          <div className="glass-card rounded-3xl p-6">
            <h2 className="font-display text-2xl font-bold text-slate-800 mb-1">{t("12 Magical Egg Encyclopedia")}</h2>
            <p className="text-xs text-slate-500 mb-5">{t("Every egg features unique patterns, animations, and hatches into a special ClassPet friend.")}</p>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
              {EGG_CATALOG.map(egg => {
                const matchedPet = CREATURE_CATALOG.find(c => c.eggId === egg.id);
                return (
                  <div key={egg.id} className="bg-white/90 rounded-2xl p-4 text-center border border-purple-100 hover:shadow-md transition">
                    <CustomEggSVG eggId={egg.id} progress={40} target={100} size={84} />
                    <p className="font-display font-bold text-sm text-slate-800 mt-2">{t(egg.name)}</p>
                    <p className="text-[11px] font-semibold text-purple-600">{t(egg.theme)}</p>
                    {matchedPet && (
                      <p className="text-[10px] text-slate-400 mt-1">{t("Hatches: {name}", { name: petText(matchedPet, "name") })}</p>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // VIEW 5: PET COLLECTION & INTERACTIVE MAGICAL PET GARDEN
    // =========================================================================
    function PetCollectionView({ data }) {
      const [gardenMood, setGardenMood] = useState('idle');

      // Aggregate all unique unlocked creatures across the classroom
      const classroomUnlockedIds = useMemo(() => {
        const set = new Set();
        data.students.forEach(s => (s.pets || []).forEach(p => set.add(p)));
        return set;
      }, [data.students]);

      // All active pets roaming in the classroom garden
      const gardenPets = useMemo(() => {
        const list = [];
        data.students.forEach(s => {
          (s.pets || []).forEach(petId => {
            const pet = CREATURE_CATALOG.find(c => c.id === petId);
            if (pet) list.push({ key: `${s.id}-${petId}`, studentName: s.name, pet });
          });
        });
        return list;
      }, [data.students]);

      const rarityStyles = {
        COMMON: 'bg-slate-100 text-slate-700',
        RARE: 'bg-sky-100 text-sky-800',
        EPIC: 'bg-purple-100 text-purple-800',
        LEGENDARY: 'bg-amber-100 text-amber-800 border border-amber-300'
      };

      return (
        <div className="space-y-8">
          {/* Interactive Magical Pet Garden */}
          <div className="rounded-3xl border-4 border-white shadow-xl overflow-hidden bg-gradient-to-b from-sky-200 via-emerald-100 to-emerald-200 p-6 relative">
            <div className="flex flex-wrap items-center justify-between gap-3 mb-4 relative z-10">
              <div>
                <span className="px-3 py-1 rounded-full bg-white/85 text-emerald-800 font-extrabold text-xs">
                  {t("INTERACTIVE FANTASY GARDEN")}
                </span>
                <h1 className="font-display text-2xl sm:text-3xl font-extrabold text-slate-800 mt-1">
                  {t("{name} Pet Sanctuary", { name: data.settings.classroomName })}
                </h1>
              </div>

              <div className="flex items-center gap-2 bg-white/85 p-1.5 rounded-2xl shadow-sm">
                {['idle', 'happy', 'sleep'].map(m => (
                  <button
                    key={m}
                    onClick={() => setGardenMood(m)}
                    className={`px-3.5 py-1.5 rounded-xl font-display font-bold text-xs capitalize cursor-pointer transition ${
                      gardenMood === m ? 'bg-emerald-500 text-white' : 'text-slate-600 hover:bg-emerald-50'
                    }`}
                  >
                    {m === 'idle' ? t("Playful") : m === 'happy' ? t("Celebrate") : t("Nap Time")}
                  </button>
                ))}
              </div>
            </div>

            {gardenPets.length === 0 ? (
              <div className="py-14 text-center bg-white/50 rounded-2xl">
                <p className="font-display text-xl font-bold text-slate-700">{t("The Magical Garden is waiting for its first friend!")}</p>
                <p className="text-sm text-slate-600 mt-1">{t("Award points and hatch an egg to see pets play together here.")}</p>
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-4 pt-4 pb-2">
                {gardenPets.map(item => (
                  <div
                    key={item.key}
                    role="button"
                    tabIndex={0}
                    aria-label={t("{pet}, {student}'s pet", { pet: t(item.pet.name), student: item.studentName })}
                    onKeyDown={onActivateKey(() => SoundFX.playPoint())}
                    onClick={() => SoundFX.playPoint()}
                    className="flex flex-col items-center bg-white/65 hover:bg-white/95 rounded-3xl p-3 backdrop-blur-sm transition transform hover:scale-105 cursor-pointer shadow-sm"
                  >
                    <CustomCreatureSVG creatureId={item.pet.id} size={88} mood={gardenMood} />
                    <span className="font-display font-bold text-sm text-slate-800 mt-1">{t(item.pet.name)}</span>
                    <span className="text-[11px] font-bold text-emerald-700 truncate max-w-full">{item.studentName}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* 12 Original Creatures Collection Gallery */}
          <div className="glass-card rounded-3xl p-6">
            <div className="flex items-center justify-between mb-5">
              <div>
                <h2 className="font-display text-2xl font-bold text-slate-800">
                  {t("ClassPets Creature Gallery ({n}/12 Discovered)", { n: classroomUnlockedIds.size })}
                </h2>
                <p className="text-xs text-slate-500">{t("Collect all 12 magical creatures across Common, Rare, Epic, and Legendary tiers.")}</p>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
              {CREATURE_CATALOG.map(pet => {
                const isDiscovered = classroomUnlockedIds.has(pet.id);
                const owners = data.students.filter(s => (s.pets || []).includes(pet.id)).map(s => s.name);

                return (
                  <div
                    key={pet.id}
                    className={`rounded-3xl p-5 border-2 text-center transition ${
                      isDiscovered ? 'bg-white border-pink-200 shadow-sm' : 'bg-slate-50/75 border-slate-200/70'
                    }`}
                  >
                    <div className="flex justify-between items-center mb-2">
                      <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${rarityStyles[pet.rarity]}`}>
                        {t(pet.rarity)}
                      </span>
                      <span className="text-[11px] font-bold text-slate-400">
                        {isDiscovered ? t("{n} Hatched", { n: owners.length }) : t("Locked")}
                      </span>
                    </div>

                    <CustomCreatureSVG creatureId={pet.id} size={105} mood={isDiscovered ? 'idle' : 'sleep'} locked={!isDiscovered} />

                    <h3 className="font-display text-lg font-bold text-slate-800 mt-2">
                      {isDiscovered ? t(pet.name) : t("Undiscovered Friend")}
                    </h3>
                    <p className="text-xs font-bold text-pink-600">{t(pet.species)}</p>
                    <p className="text-xs text-slate-500 mt-1">{t(pet.personality)}</p>

                    {owners.length > 0 && (
                      <p className="text-[11px] font-semibold text-emerald-700 bg-emerald-50 rounded-xl px-2.5 py-1 mt-3 truncate">
                        {t("Friends with: {names}", { names: owners.join(', ') })}
                      </p>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // VIEW 6: LEADERBOARD (With Podiums & Optional Hide Toggle)
    // =========================================================================
    function LeaderboardView({ data, onToggleLeaderboard }) {
      const sorted = useMemo(() => {
        return [...data.students].sort((a, b) => (b.lifetimePoints || 0) - (a.lifetimePoints || 0));
      }, [data.students]);

      const top3 = sorted.slice(0, 3);

      return (
        <div className="space-y-6">
          <div className="glass-card rounded-3xl p-6 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 className="font-display text-2xl sm:text-3xl font-extrabold text-slate-800">{t("Classroom Leaderboard")}</h1>
              <p className="text-sm text-slate-500">{t("Celebrate student milestones—or hide rankings anytime for a non-competitive classroom.")}</p>
            </div>

            <button
              onClick={() => onToggleLeaderboard(!data.settings.showLeaderboard)}
              className={`px-4 py-2.5 rounded-2xl font-display font-bold text-sm cursor-pointer transition ${
                data.settings.showLeaderboard
                  ? 'bg-slate-800 text-white hover:bg-slate-700'
                  : 'bg-emerald-500 text-white hover:bg-emerald-600'
              }`}
            >
              {data.settings.showLeaderboard ? t("Hide Leaderboard") : t("Show Leaderboard")}
            </button>
          </div>

          {!data.settings.showLeaderboard ? (
            <div className="glass-card rounded-3xl p-12 text-center space-y-3">
              <h2 className="font-display text-2xl font-bold text-slate-700">{t("Leaderboard is Currently Hidden")}</h2>
              <p className="text-sm text-slate-500 max-w-md mx-auto">
                {t("Competitive rankings are hidden so every student can focus on their personal egg-hatching journey.")}
              </p>
            </div>
          ) : (
            <>
              {/* Animated Top 3 Podium */}
              {top3.length > 0 && (
                <div className="glass-card rounded-3xl p-6 sm:p-8">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end max-w-4xl mx-auto">
                    {/* 2nd Place */}
                    {top3[1] && (
                      <div className="order-2 md:order-1 bg-gradient-to-b from-slate-100 to-slate-200 rounded-3xl p-5 text-center border-2 border-white shadow-md">
                        <span className="inline-block px-3 py-1 rounded-full bg-slate-600 text-white font-display font-bold text-xs mb-2">{t("2nd Place")}</span>
                        <CustomCreatureSVG creatureId={top3[1].activePetId || 'bubbles'} size={86} mood="happy" />
                        <h3 className="font-display text-xl font-bold text-slate-800 mt-2">{top3[1].name}</h3>
                        <p className="font-display text-2xl font-extrabold text-slate-700">{top3[1].lifetimePoints}{' '}{t("pts")}</p>
                        <p className="text-xs font-bold text-slate-500">{t("{n} Pets Hatched", { n: top3[1].pets?.length || 0 })}</p>
                      </div>
                    )}

                    {/* 1st Place Champion */}

    // =========================================================================
    // VIEW 7: ACHIEVEMENT BADGES (9 Default + Custom Teacher Badges)
    // =========================================================================
    function AchievementsView({ data, onUpdateData, showToast }) {
      const [badgeName, setBadgeName] = useState('');
      const [badgeDesc, setBadgeDesc] = useState('');
      const [selectedBadgeId, setSelectedBadgeId] = useState(data.badges[0]?.id || 'b1');

      const handleCreateBadge = (e) => {
        e.preventDefault();
        if (!badgeName.trim()) return;
        const colors = ['#F472B6', '#38BDF8', '#34D399', '#FBBF24', '#A78BFA', '#FB923C'];
        const created = {
          id: `b-${Date.now()}`,
          name: badgeName.trim(),
          description: badgeDesc.trim() || 'Special classroom achievement awarded by teacher.',
          color: colors[data.badges.length % colors.length],
          autoRule: 'manual'
        };
        onUpdateData(prev => ({
          ...prev,
          badges: [...prev.badges, created]
        }));
        setBadgeName('');
        setBadgeDesc('');
        setSelectedBadgeId(created.id);
        showToast(t('Created achievement badge "{name}"!', { name: created.name }));
      };

      const toggleStudentBadge = (studentId, badgeId) => {
        onUpdateData(prev => ({
          ...prev,
          students: prev.students.map(s => {
            if (s.id !== studentId) return s;
            const has = (s.badges || []).includes(badgeId);
            return {
              ...s,
              badges: has ? s.badges.filter(x => x !== badgeId) : [...(s.badges || []), badgeId]
            };
          })
        }));
        showToast(t('Student badge updated!'));
      };

      return (
        <div className="space-y-6">
          <div className="glass-card rounded-3xl p-6">
            <h1 className="font-display text-2xl sm:text-3xl font-extrabold text-slate-800 mb-1">{t("Achievement Badges")}</h1>
            <p className="text-sm text-slate-500 mb-5">{t("Select any badge below to award it to students, or create your own custom badges.")}</p>

            {/* Create Custom Badge Form */}
            <form onSubmit={handleCreateBadge} className="grid grid-cols-1 md:grid-cols-3 gap-3 bg-white/75 p-4 rounded-2xl border border-pink-100 mb-6">
              <input
                type="text"
                placeholder={t("Custom Badge Title (e.g. Art Genius)")}
                value={badgeName}
                onChange={e => setBadgeName(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-bold"
              />
              <input
                type="text"
                placeholder={t("Short badge description...")}
                value={badgeDesc}
                onChange={e => setBadgeDesc(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-semibold"
              />
              <button
                type="submit"
                className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-500 text-white font-display font-bold text-sm cursor-pointer"
              >
                {t("+ Create Custom Badge")}
              </button>
            </form>

            {/* Badge Cards */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {data.badges.map(badge => {
                const holders = data.students.filter(s => (s.badges || []).includes(badge.id));
                const isSelected = selectedBadgeId === badge.id;
                return (
                  <div
                    key={badge.id}
                    role="button"
                    tabIndex={0}
                    aria-pressed={isSelected}
                    onKeyDown={onActivateKey(() => setSelectedBadgeId(badge.id))}
                    onClick={() => setSelectedBadgeId(badge.id)}
                    className={`rounded-2xl p-4 border-2 flex items-center gap-4 cursor-pointer transition ${
                      isSelected ? 'bg-amber-50/90 border-amber-400 shadow-md' : 'bg-white/90 border-slate-100 hover:border-pink-200'
                    }`}
                  >
                    <BadgeMedalSVG color={badge.color} size={58} />
                    <div className="min-w-0">
                      <h3 className="font-display font-bold text-base text-slate-800">{t(badge.name)}</h3>
                      <p className="text-xs text-slate-500 line-clamp-2">{t(badge.description)}</p>
                      <p className="text-[11px] font-extrabold text-purple-600 mt-1">
                        {t("Earned by {n} student(s)", { n: holders.length })}
                      </p>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Assign Selected Badge to Students */}
          <div className="glass-card rounded-3xl p-6">
            <h2 className="font-display text-xl font-bold text-slate-800 mb-3">
              {t("Award “{badge}” to Students", { badge: t(data.badges.find(b => b.id === selectedBadgeId)?.name || "") })}
            </h2>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
              {data.students.map(stu => {

                return (
                  <button
                    key={stu.id}
                    onClick={() => toggleStudentBadge(stu.id, selectedBadgeId)}
                    className={`p-3 rounded-2xl border-2 text-left flex items-center justify-between transition cursor-pointer ${
                      earned ? 'bg-emerald-50 border-emerald-400 text-emerald-900' : 'bg-white border-slate-100 text-slate-600'

                    <span className="text-xs font-extrabold">{earned ? t('EARNED') : t('+ Give')}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );

    // =========================================================================
    // VIEW 10: BACKUP AND RESTORE (JSON Export/Import + Student CSV Export)
    // =========================================================================
    function BackupAndRestoreView({ data, activeWorkspaceId, onRestoreData, onMarkBackupTime, setConfirmDialog, showToast }) {
      const fileInputRef = useRef(null);

      const handleExportJSON = () => {
        const payload = {
          app: 'CLASSPETS Commercial Edition',
          exportedAt: new Date().toISOString(),
          workspaceId: activeWorkspaceId,
          classroomData: data
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `CLASSPETS_${activeWorkspaceId}_Backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        onMarkBackupTime();
        showToast(t('Classroom JSON backup downloaded!'));
      };

      const handleExportCSV = () => {
        // Quote every cell and neutralize spreadsheet formulas (CSV injection: =, +, -, @, tab, CR).
        const csvCell = (value) => {
          let str = String(value ?? '');
          if (/^[=+\-@\t\r]/.test(str)) str = `'${str}`;
          return `"${str.replace(/"/g, '""')}"`;
        };
        const headers = [t('Number'), t('Student Name'), t('Lifetime Points'), t('Current Egg Progress'), t('Current Egg'), t('Hatched Eggs'), t('Collected Pets')];
        const rows = data.students.map(s => [
          s.number,
          s.name || '',
          s.lifetimePoints || 0,
          s.eggProgress || 0,
          t(EGG_CATALOG.find(e => e.id === s.currentEggId)?.name || '') || s.currentEggId || '',
          s.hatchedCount || 0,
          (s.pets || []).map(id => t(CREATURE_CATALOG.find(c => c.id === id)?.name || id)).join(', ')
        ]);
        const csvContent = [headers, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
        // UTF-8 BOM so Excel shows accented names correctly.
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `CLASSPETS_${activeWorkspaceId}_Students_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(t('Student list exported as CSV!'));
      };

      const handleFileSelected = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            const candidate = parsed.classroomData || parsed;
            if (!candidate || !Array.isArray(candidate.students) || !candidate.settings) {
              showToast(t('Invalid CLASSPETS backup file format.'), 'error');
              return;
            }
            setConfirmDialog({
              title: t('Confirm Classroom Restore'),
              message: t('Restoring "{file}" will replace all current records in workspace {ws} ({current} current students will be replaced with {incoming} students from the backup). Continue?', { file: file.name, ws: activeWorkspaceId, current: data.students.length, incoming: candidate.students.length }),
              danger: true,
              onConfirm: () => {
                onRestoreData(candidate);
                setConfirmDialog(null);
              }
            });
          } catch (err) {
            showToast(t('Could not read JSON backup file.'), 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          {/* Important Local-First Storage Advisory */}
          <div className="rounded-3xl bg-amber-50 border-2 border-amber-300 p-6 space-y-2">
            <h1 className="font-display text-2xl sm:text-3xl font-extrabold text-amber-950">
              {t("Backup & Restore Your Classroom Records")}
            </h1>
            <p className="text-sm text-amber-900 leading-relaxed">
              <strong>{t("Important Notice:")}</strong>{' '}{tRich("Your CLASSPETS classroom records are saved locally inside this browser and device ({db}). Clearing browser data, switching computers, or losing your device can erase local browser storage.", { db: <code>{WorkspaceDB.getDbName(activeWorkspaceId)}</code> })}{' '}<strong>{t("Downloading regular JSON backups protects your students’ points, eggs, and pets for the entire school year.")}</strong>
            </p>
            {data.meta?.lastBackupAt && (
              <p className="text-xs font-extrabold text-emerald-700 pt-1">
                {t("Last backup downloaded: {when}", { when: formatDateTime(data.meta.lastBackupAt) })}
              </p>
            )}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
            {/* Export JSON Backup */}
            <div className="glass-card rounded-3xl p-6 flex flex-col justify-between space-y-4 border-t-4 border-emerald-400">
              <div>
                <span className="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold">{t("FULL RESTORE FILE")}</span>
                <h2 className="font-display text-xl font-bold text-slate-800 mt-2">{t("Export Classroom Backup")}</h2>
                <p className="text-xs text-slate-500 mt-1">
                  {t("Downloads a complete JSON file containing all students, points, reward history, eggs, pets, badges, and settings.")}
                </p>
              </div>
              <button
                onClick={handleExportJSON}
                className="w-full py-3.5 px-4 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-display font-bold text-sm shadow-md cursor-pointer"
              >
                {t("EXPORT CLASSROOM BACKUP")}
              </button>
            </div>

            {/* Import JSON Backup */}
            <div className="glass-card rounded-3xl p-6 flex flex-col justify-between space-y-4 border-t-4 border-pink-400">
              <div>
                <span className="px-2.5 py-0.5 rounded-full bg-pink-100 text-pink-800 text-xs font-extrabold">{t("RESTORE RECORDS")}</span>
                <h2 className="font-display text-xl font-bold text-slate-800 mt-2">{t("Import Classroom Backup")}</h2>
                <p className="text-xs text-slate-500 mt-1">
                  {t("Restore your classroom from a previously exported CLASSPETS JSON file. Requires confirmation before overwriting.")}
                </p>
              </div>
              <div>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept=".json,application/json"
                  onChange={handleFileSelected}
                  className="hidden"
                />
                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="w-full py-3.5 px-4 rounded-2xl bg-pink-500 hover:bg-pink-600 text-white font-display font-bold text-sm shadow-md cursor-pointer"
                >
                  {t("IMPORT CLASSROOM BACKUP")}
                </button>
              </div>
            </div>

            {/* Export Student CSV */}
            <div className="glass-card rounded-3xl p-6 flex flex-col justify-between space-y-4 border-t-4 border-sky-400">
              <div>
                <span className="px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-800 text-xs font-extrabold">{t("SPREADSHEET REPORT")}</span>
                <h2 className="font-display text-xl font-bold text-slate-800 mt-2">{t("Export Student List")}</h2>
                <p className="text-xs text-slate-500 mt-1">
                  {t("Downloads a CSV spreadsheet of student numbers, names, total points, hatched eggs, and collected pets.")}
                </p>
              </div>
              <button
                onClick={handleExportCSV}
                className="w-full py-3.5 px-4 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-display font-bold text-sm shadow-md cursor-pointer"
              >
                {t("EXPORT STUDENT LIST (CSV)")}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Mount React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
